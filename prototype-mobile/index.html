<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <meta name="theme-color" content="#000000">
  <title>Kliff &amp; Chao (phone prototype)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Inter:wght@400;500;600&family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="phone">

  <!-- the meadow and the river, drawn as depth layers (assets/world.js); scenes 04 and 05 are clear panes over it -->
  <div class="world" aria-hidden="true"><div class="stage" id="worldStage"></div></div>

  <!-- ============================================================ 01 · gate -->
  <section class="scene is-active" id="s01" aria-label="You are invited">
    <div class="stage">
      <div class="s01-bg">
        <img class="layer amb-cloud" data-asset="p01_sky" alt="">
        <img class="layer" data-asset="p01_fg" alt="">
        <div class="layer sway sway--far" data-asset="p01_fg" data-bg></div>
        <div class="layer sway sway--near-l" data-asset="p01_fg" data-bg></div>
        <div class="layer sway sway--near-r" data-asset="p01_fg" data-bg></div>
        <div class="layer bub" data-asset="p01_bubble0"><img data-src="p01_bubble0" alt=""></div>
        <div class="layer bub" data-asset="p01_bubble1"><img data-src="p01_bubble1" alt=""></div>
        <div class="layer bub" data-asset="p01_bubble2"><img data-src="p01_bubble2" alt=""></div>
        <div class="layer bub" data-asset="p01_bubble3"><img data-src="p01_bubble3" alt=""></div>
        <img class="layer" data-asset="p01_logo" alt="Kliff and Chao">
      </div>
      <img class="layer" data-asset="p01_monitor" alt="">
      <div class="layer monitor" data-asset="p01_screen">
        <img class="monitor__img" data-src="p01_screen" alt="">
        <div class="monitor__ghost monitor__ghost--r"></div>
        <div class="monitor__ghost monitor__ghost--b"></div>
        <div class="monitor__scan"></div>
        <div class="monitor__dark"></div>
      </div>
      <div class="s01-form">
        <h1 class="s01-h">You are invited!</h1>
        <p class="s01-sub">Please enter the password from your invitation</p>
        <div class="layer pill" data-asset="p01_input">
          <input id="pw" type="password" placeholder="ENTER" aria-label="Password from your invitation"
                 autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
          <button class="pill__go" id="go" type="button" aria-label="Enter" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <p class="s01-err" role="alert"></p>
      </div>
    </div>
  </section>

  <!-- ============================================================ 02 · terminal -->
  <section class="scene" id="s02" aria-label="Logging in">
    <div class="stage">
      <div class="layer crt" data-asset="p02_screen">
        <div class="crt__wash"></div>
        <div class="term">
          <div class="t-boot"><p></p><p></p><p></p></div>
          <!-- the bar comes first; at 100% the login line takes its place -->
          <div class="t-slot">
            <div class="t-progress">
              <div class="t-bar"><i></i></div>
              <span class="t-pct">0%</span>
              <svg class="t-hourglass" viewBox="0 0 9 12" aria-hidden="true">
                <path d="M0 0h9v1.5H0zM0 10.5h9V12H0zM1 1.5h7v1l-2.5 3 2.5 3v2H1v-2l2.5-3L1 2.5z"/>
              </svg>
            </div>
            <h1 class="t-login"></h1>
          </div>
          <div class="t-hello"><p></p><p></p><p></p></div>
          <div class="t-dino" aria-hidden="true"><svg class="dino" viewBox="0 0 20 20"></svg><i class="t-ground"></i></div>
        </div>
        <canvas class="crt__noise" width="108" height="234"></canvas>
        <button class="skip02" type="button">SKIP ›</button>
        <div class="crt__roll"></div>
        <div class="crt__scan"></div>
      </div>
    </div>
  </section>

  <!-- ============================================================ 03 · intro -->
  <section class="scene" id="s03" aria-label="Intro">
    <div class="stage">
      <div class="layer full s03-video">
        <video class="intro-video" muted loop playsinline preload="auto" src="site/video/intro-v2.mp4"></video>
        <div class="s03-shade"></div>
      </div>
      <div class="s03-ui">
        <button class="verse" id="verse" type="button" aria-live="polite"><span class="verse__t"></span><cite></cite><span class="verse__hint" aria-hidden="true">Tap to see more verses</span></button>
      </div>
    </div>
  </section>

  <!-- ============================================================ 04 · journey -->
  <section class="scene" id="s04" aria-label="Journey">
    <div class="stage">
      <button class="layer folder" data-asset="p04_folder" id="folder4" aria-label="Open the journey folder">
        <img data-src="p04_folder" alt="">
        <span class="folder__label">our story</span>
      </button>
      <div class="win" id="win4" role="dialog" aria-label="Our journey">
        <div class="win__bar">
          <div class="lights"><button class="dot dot--close" data-close aria-label="Close window"></button><i class="dot dot--mid"></i><i class="dot dot--end"></i></div>
          <div class="chips" id="chips" role="tablist"></div>
        </div>
        <div class="win__body" id="panes4" data-scroll></div>
      </div>
      <img class="layer cursor" data-asset="p04_cursor" id="cursor4" alt="">
    </div>
  </section>

  <!-- ============================================================ 05 · wedding -->
  <section class="scene" id="s05" aria-label="Wedding">
    <div class="stage">
      <button class="layer folder" data-asset="p05_folder" id="folder5" aria-label="Open the new chapter folder">
        <img data-src="p05_folder" alt="">
        <span class="folder__label">and now, our new chapter begins</span>
      </button>
      <div class="win win--sheet" id="win5" role="dialog" aria-label="The wedding">
        <div class="win__bar">
          <div class="lights"><button class="dot dot--close" data-close aria-label="Close window"></button><i class="dot dot--mid"></i><i class="dot dot--end"></i></div>
          <div class="chips" id="tabs5" role="tablist"></div>
        </div>
        <div class="win__body" id="panes5" data-scroll></div>
      </div>
      <img class="layer cursor" data-asset="p04_cursor" id="cursor5" alt="">
    </div>
  </section>

  <!-- ============================================================ chrome (03 onward): fixed above every scene and move -->
  <header class="chrome-top" id="chromeTop">
    <button class="wordmark" data-go="3" aria-label="Back to the intro"><img data-src="p01_logo" alt="Kliff and Chao"></button>
    <nav class="chrome-nav" id="chromeNav" aria-label="Sections">
      <span class="chrome-nav__pill" aria-hidden="true"></span>
      <button data-go="3" aria-current="page">INTRO</button>
      <button data-go="4">JOURNEY</button>
      <button data-go="5">WEDDING</button>
    </nav>
    <button class="rsvp" data-rsvp>RSVP</button>
  </header>
  <button class="music" id="mute" aria-pressed="false" aria-label="Turn the music on">
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <svg class="spk" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/>
      <path d="M17 9l5 6M22 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="veil" id="veil" aria-hidden="true"></div>
  <div class="toast" role="status"></div>
</main>

<script src="assets/manifest.js"></script>
<script src="assets/world.js"></script>
<script src="assets/world-gl.js"></script>
<script src="assets/content.js"></script>
<script src="app.js"></script>
</body>
</html>
